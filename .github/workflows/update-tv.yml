name: Vodafone.gr EPG Builder v18.04 2026

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tv:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Athens

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install xmlbuilder2

      - name: Create data folder
        run: mkdir -p data

      - name: Clean old cached JSON files from GitHub
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@example.com"
          
          # Σβήνουμε οριστικά όλα τα παλιά raw JSON που έχουν συσσωρευτεί στο repo
          if [ -n "$(ls data/raw_*.json 2>/dev/null)" ]; then
            git rm -f data/raw_*.json || true
          fi
          rm -f data/raw_*.json

      - name: Fetch Vodafone JSON (multi-day EPG)
        run: |
          # Κατέβασμα των 7 ημερών ακριβώς με τον δικό σου αρχικό τρόπο
          for i in {0..6}
          do
            DATE=$(date -d "+$i day" +'%Y-%m-%d')
            echo "Fetching $DATE"

            curl -s -L \
              --connect-timeout 1000 \
               --max-time 3000 \
                --retry 10 \
                --retry-delay 5 \
                  "https://vodafone.gr" \
                    -o "data/raw_$DATE.json"

            # ΑΣΦΑΛΕΙΑ: Αν η Vodafone επέστρεψε HTML (Incapsula block) ή είναι άδειο
            if [ ! -s "data/raw_$DATE.json" ] || grep -q -i "<html" "data/raw_$DATE.json"; then
              echo "Warning: Blocked or empty data for $DATE. Using safe fallback []."
              echo "[]" > "data/raw_$DATE.json"
            fi
          done

          # Αδειάζουμε τα duplicate δεδομένα από τις μέρες 1 έως 6 για να μειωθεί το μέγεθος
          for i in {1..6}
          do
            DATE=$(date -d "+$i day" +'%Y-%m-%d')
            if [ -f "data/raw_$DATE.json" ]; then
              echo "Cleaning duplicates from $DATE"
              echo "[]" > "data/raw_$DATE.json"
            fi
          done

      - name: Generate XMLTV + M3U
        run: node scripts/generate.js

      - name: Commit & push
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@example.com"

          # Προσθέτουμε μόνο το epg.xml και τα 7 τρέχοντα JSON (τα 6 είναι άδεια)
          git add data/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "EPG update $(date +'%Y-%m-%d %H:%M')"
          git push
