name: Vodafone.gr EPG Builder v18.04 2026

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tv:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Athens

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install xmlbuilder2

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch Vodafone JSON (multi-day EPG)
        run: |
          # 1. Κατέβασμα όλων των ημερών ακριβώς με τον παλιό τρόπο που δουλεύει
          for i in {0..6}
          do
            DATE=$(date -d "+$i day" +'%Y-%m-%d')
            echo "Fetching $DATE"

            curl -s -L \
              --connect-timeout 1000 \
               --max-time 3000 \
                --retry 10 \
                --retry-delay 5 \
                  "https://vodafone.gr" \
                    -o "data/raw_$DATE.json"

            # ΑΣΦΑΛΕΙΑ: Αν η Vodafone επέστρεψε HTML (Incapsula block) ή το αρχείο είναι άδειο, 
            # το μετατρέπουμε σε έγκυρο JSON [] για να ΜΗΝ κρασάρει το generate.js
            if [ ! -s "data/raw_$DATE.json" ] || grep -q -i "<html" "data/raw_$DATE.json"; then
              echo "Warning: Blocked by Incapsula or empty data for $DATE. Using safe fallback []."
              echo "[]" > "data/raw_$DATE.json"
            fi
          done

          # 2. Το "μαγικό" κόλπο: Αδειάζουμε τα duplicate δεδομένα από τις μέρες 1 έως 6
          for i in {1..6}
          do
            DATE=$(date -d "+$i day" +'%Y-%m-%d')
            if [ -f "data/raw_$DATE.json" ]; then
              echo "Cleaning duplicates from $DATE"
              echo "[]" > "data/raw_$DATE.json"
            fi
          done

      - name: Generate XMLTV + M3U
        run: |
          # ΔΗΜΙΟΥΡΓΙΑ ΑΔΕΙΟΥ XML ΓΙΑ OVERWRITE: 
          # Φτιάχνουμε μια έγκυρη άδεια δομή XMLTV ώστε το Node να μην βρει παλιό ιστορικό 
          # και να κάνει υποχρεωτικά reset τη βάση δεδομένων του.
          EMPTY_XML='<?xml version="1.0" encoding="UTF-8"?><tv></tv>'
          
          echo "$EMPTY_XML" > epg.xml
          echo "$EMPTY_XML" > data/epg.xml
          
          # Τρέχουμε τη δημιουργία
          node scripts/generate.js

      - name: Commit & push
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@example.com"

          git add data/
          git add epg.xml || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "EPG update $(date +'%Y-%m-%d %H:%M')"
          git push
