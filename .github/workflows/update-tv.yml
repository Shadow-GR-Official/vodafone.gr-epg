name: Vodafone.gr EPG Builder v18.04 2026

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tv:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Athens

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install xmlbuilder2

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch Vodafone JSON (multi-day EPG)
        run: |
          # 1. Κατέβασμα όλων των ημερών κανονικά (όπως δούλευε πάντα στο αρχικό σου script)
          for i in {0..6}
          do
            DATE=$(date -d "+$i day" +'%Y-%m-%d')
            echo "Fetching $DATE"

            curl -s -L \
              --connect-timeout 1000 \
               --max-time 3000 \
                --retry 10 \
                --retry-delay 5 \
                  "https://vodafone.gr" \
                    -o "data/raw_$DATE.json"

            # ΑΣΦΑΛΕΙΑ: Αν επέστρεψε HTML (Incapsula block) ή είναι άδειο, 
            # βάζουμε έγκυρο JSON [] για να μην κρασάρει το generate.js
            if [ ! -s "data/raw_$DATE.json" ] || grep -q -i "<html" "data/raw_$DATE.json"; then
              echo "Warning: Blocked or empty data for $DATE. Using safe fallback []."
              echo "[]" > "data/raw_$DATE.json"
            fi
          done

      - name: Generate XMLTV + M3U
        run: |
          # ΟΛΙΚΗ ΔΙΑΓΡΑΦΗ ΙΣΤΟΡΙΚΟΥ: Σβήνουμε το παλιό epg.xml 
          # για να αναγκάσουμε το generate.js να κάνει πλήρη αντικατάσταση (Overwrite)
          rm -f epg.xml data/epg.xml
          
          # Τρέχουμε τη δημιουργία από το μηδέν
          node scripts/generate.js

      - name: Commit & push
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@example.com"

          git add data/
          git add epg.xml || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "EPG update $(date +'%Y-%m-%d %H:%M')"
          git push
