name: Vodafone.gr EPG Builder v18.04 2026

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tv:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Athens

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install xmlbuilder2

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch Vodafone JSON (Single Multi-day Request)
        run: |
          TODAY=$(date +'%Y-%m-%d')
          echo "Fetching multi-day EPG starting from $TODAY"

          curl -s -L \
            --connect-timeout 1000 \
            --max-time 3000 \
            --retry 10 \
            --retry-delay 5 \
            "https://vodafone.gr" \
            -o "data/raw_$TODAY.json"

          # Έλεγχος αν είναι άδειο
          if [ ! -s "data/raw_$TODAY.json" ]; then
            echo "Error: No data fetched!"
            exit 1
          fi

      - name: Generate XMLTV + M3U
        run: node scripts/generate.js

      - name: Compile and Run Java Filter
        run: |
          # Υποθέτουμε ότι το generate.js παράγει ένα αρχείο π.χ. data/epg.xml
          # Αν το παράγει σε άλλον φάκελο, άλλαξε τη διαδρομή στο Java script
          javac EPGFilter.java
          java EPGFilter

      - name: Commit & push
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@example.com"

          # Προσθέτουμε μόνο το τελικό epg.xml και καθαρίζουμε τα raw JSON αν δεν τα θες στο repo
          rm -f data/raw_*.json
          git add data/
          git add epg.xml || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "EPG update $(date +'%Y-%m-%d %H:%M')"
          git push
