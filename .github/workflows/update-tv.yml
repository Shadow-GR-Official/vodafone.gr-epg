name: Vodafone.gr EPG Builder v18.04 2026

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tv:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Athens

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install xmlbuilder2

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch Vodafone JSON (Optimized Multi-day)
        run: |
          for i in {0..6}
          do
            DATE=$(date -d "+$i day" +'%Y-%m-%d')
            
            if [ $i -eq 0 ]; then
              echo "Fetching multi-day EPG starting from $DATE"
              curl -s -L \
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                --connect-timeout 1000 \
                --max-time 3000 \
                --retry 10 \
                --retry-delay 5 \
                "https://vodafone.gr" \
                -o "data/raw_$DATE.json"
                
              # Αν για κάποιο λόγο αποτύχει το API, βάζουμε άδειο array για να μη σπάσει το build
              if [ ! -s "data/raw_$DATE.json" ]; then
                echo "Warning: API returned empty data for $DATE"
                echo "[]" > "data/data/raw_$DATE.json"
              fi
            else
              # Για τις υπόλοιπες μέρες δημιουργούμε άδεια αρχεία
              # Το API τα δίνει όλα στο πρώτο request, οπότε γλιτώνουμε το duplicate μέγεθος
              echo "Creating empty placeholder for $DATE to prevent duplicates"
              echo "[]" > "data/raw_$DATE.json"
            fi
          done

      - name: Generate XMLTV + M3U
        run: node scripts/generate.js

      - name: Commit & push
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@example.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "EPG update $(date +'%Y-%m-%d %H:%M')"
          git push
